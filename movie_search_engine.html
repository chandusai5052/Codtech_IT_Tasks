<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSeek // Movie Search Engine</title>
    <style>
        /* CSS RESET & UI VARIABLES */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER & SEARCH BAR */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-wrapper {
            max-width: 600px;
            margin: 30px auto 0;
            display: flex;
            gap: 12px;
        }

        .search-wrapper input {
            flex: 1;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-wrapper input:focus {
            border-color: var(--accent);
        }

        .search-wrapper button {
            padding: 0 28px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .search-wrapper button:hover {
            opacity: 0.9;
        }

        /* MOVIE DISPLAY GRID */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .movie-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .poster-wrapper {
            position: relative;
            padding-top: 145%; /* Standard Movie Poster Ratio */
            background: #0b0f19;
            overflow: hidden;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info {
            padding: 16px;
        }

        .movie-info h3 {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .movie-info span {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* MODAL SCREEN DESIGN */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-secondary);
            max-width: 700px;
            width: 100%;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            position: relative;
            display: flex;
            animation: scaleUp 0.3s ease-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 10;
        }

        .close-modal:hover { color: #fff; }

        .modal-poster {
            width: 40%;
            object-fit: cover;
            background: #0b0f19;
        }

        .modal-details {
            width: 60%;
            padding: 40px 30px;
        }

        .modal-details h2 { font-size: 2rem; margin-bottom: 10px; line-height: 1.2; }
        .meta-row { display: flex; gap: 15px; color: var(--accent); font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }
        .plot { color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; font-size: 0.95rem; }
        .extra-info p { font-size: 0.9rem; margin-bottom: 8px; }
        .extra-info strong { color: var(--text-muted); font-weight: 400; margin-right: 5px; }

        /* AUXILIARY STATES */
        .hidden { display: none !important; }
        .state-msg { text-align: center; color: var(--text-muted); font-size: 1.2rem; margin-top: 80px; width: 100%; }

        @media (max-width: 650px) {
            .modal-content { flex-direction: column; height: 90vh; overflow-y: auto; }
            .modal-poster { width: 100%; height: 250px; }
            .modal-details { width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cine<span>Seek</span></h1>
            <p>Discover real-time cinematic telemetry data profiles</p>
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search movies, series, or games..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>
        </header>

        <main class="movies-grid" id="movies-grid">
            <div class="state-msg">Type a title above to begin exploring.</div>
        </main>
    </div>

    <div class="modal hidden" id="movie-modal" role="dialog">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <img src="" alt="Movie Poster" class="modal-poster" id="modal-poster">
            <div class="modal-details">
                <h2 id="modal-title">Movie Title</h2>
                <div class="meta-row">
                    <span id="modal-year">---</span>
                    <span id="modal-runtime">---</span>
                    <span id="modal-rating">★ --</span>
                </div>
                <p class="plot" id="modal-plot">Plot summary data stream loads here...</p>
                <div class="extra-info">
                    <p><strong id="label-director">Director:</strong> <span id="modal-director">---</span></p>
                    <p><strong id="label-actors">Stars:</strong> <span id="modal-actors">---</span></p>
                    <p><strong id="label-genre">Genre:</strong> <span id="modal-genre">---</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // INSERT YOUR ACTIVATED OMDB API KEY HERE
        const API_KEY = "YOUR_API_KEY_HERE"; 
        const BASE_URL = `https://www.omdbapi.com/?apikey=${API_KEY}`;

        // DOM Elements
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const moviesGrid = document.getElementById('movies-grid');
        const movieModal = document.getElementById('movie-modal');
        const closeModalBtn = document.getElementById('close-modal');

        // Main Interaction Wireframes
        searchBtn.addEventListener('click', () => queryMovies(searchInput.value.trim()));
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') queryMovies(searchInput.value.trim()); });
        closeModalBtn.addEventListener('click', toggleModal);
        movieModal.addEventListener('click', (e) => { if (e.target === movieModal) toggleModal(); });

        // Query Database Lifecycle
        async function queryMovies(searchKeyword) {
            if (!searchKeyword) return;
            renderStateMessage("Searching database logs...");

            try {
                const response = await fetch(`${BASE_URL}&s=${encodeURIComponent(searchKeyword)}`);
                const data = await response.json();

                if (data.Response === "True") {
                    displayMovieCards(data.Search);
                } else {
                    renderStateMessage(`Error: ${data.Error}`);
                }
            } catch (err) {
                renderStateMessage("Network failure. API connection dropped.");
            }
        }

        // DOM List Construction
        function displayMovieCards(movies) {
            moviesGrid.innerHTML = ""; // Wipe container clear

            movies.forEach(movie => {
                const posterPath = movie.Poster !== "N/A" ? movie.Poster : 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=400&auto=format&fit=crop';
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${posterPath}" alt="${movie.Title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <h3>${movie.Title}</h3>
                        <span>${movie.Year} (${movie.Type})</span>
                    </div>
                `;
                
                // Clicking a card pulls deep telemetry profile
                card.addEventListener('click', () => fetchExtendedDetails(movie.imdbID));
                moviesGrid.appendChild(card);
            });
        }

        // Deep Entity Detail Pull
        async function fetchExtendedDetails(imdbId) {
            try {
                const response = await fetch(`${BASE_URL}&i=${imdbId}&plot=full`);
                const movie = await response.json();

                if (movie.Response === "True") {
                    populateAndOpenModal(movie);
                }
            } catch (err) {
                console.error("Critical error parsing detailed payload metadata.", err);
            }
        }

        // Modal Rendering Pipeline
        function populateAndOpenModal(movie) {
            const posterPath = movie.Poster !== "N/A" ? movie.Poster : 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=400&auto=format&fit=crop';
            
            document.getElementById('modal-poster').src = posterPath;
            document.getElementById('modal-title').textContent = movie.Title;
            document.getElementById('modal-year').textContent = movie.Year;
            document.getElementById('modal-runtime').textContent = movie.Runtime;
            document.getElementById('modal-rating').textContent = `★ ${movie.imdbRating}`;
            document.getElementById('modal-plot').textContent = movie.Plot;
            document.getElementById('modal-director').textContent = movie.Director;
            document.getElementById('modal-actors').textContent = movie.Actors;
            document.getElementById('modal-genre').textContent = movie.Genre;

            toggleModal();
        }

        function toggleModal() {
            movieModal.classList.toggle('hidden');
        }

        function renderStateMessage(message) {
            moviesGrid.innerHTML = `<div class="state-msg">${message}</div>`;
        }
    </script>
</body>
</html>
